patterns:
  - name: "AWS Access Key"
    pattern: "(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}"
    description: "AWS Access Key ID detected. Ensure this is not hardcoded."
  
  - name: "AWS Secret Key"
    pattern: "(?:[Aa][Ww][Ss])(.{0,20})?['\"][0-9a-zA-Z\/+]{40}['\"]"
    description: "Potential AWS Secret Key detected."
  
  - name: "OpenAI API Key"
    pattern: "sk-[a-zA-Z0-9]{20}T3BlbkFJ[a-zA-Z0-9]{20}|sk-(proj-|org-)?[a-zA-Z0-9]{32,}"
    description: "OpenAI API Key detected."
  
  - name: "Stripe Secret Key"
    pattern: "(sk_live_[0-9a-zA-Z]{24})"
    description: "Stripe Live Secret Key detected."
  
  - name: "Slack Token"
    pattern: "(xox[p|b|o|a]-[0-9]{12}-[0-9]{12}-[0-9]{12}-[a-z0-9]{32})"
    description: "Slack API Token detected."
  
  - name: "Generic Private Key"
    pattern: "-----BEGIN [A-Z]+ PRIVATE KEY-----"
    description: "PEM Private Key block detected."
  
  - name: "GitHub Token"
    pattern: "(ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{59})"
    description: "GitHub Personal Access Token detected."
    
  - name: "Gemini / Google Cloud API Key"
    pattern: "AIza[0-9A-Za-z\\-_]{35}"
    description: "Gemini / Google Cloud AI API Key detected."
    
  # - name: "Azure Storage Key"
  #   pattern: "[a-zA-Z0-9+/]{88}"
  #   description: "Potential Azure Storage Key detected (high false positive risk, check context)."
    
  - name: "Generic API Key"
    pattern: "(?i)(?:api_key|apikey|access_token|auth_token)[\\s]*=[\\s]*['\"][a-zA-Z0-9_\\-]{16,64}['\"]"
    description: "Generic API Key assignment detected."

  - name: "Facebook Access Token"
    pattern: "EAACEdEose0cBA[0-9A-Za-z]+"
    description: "Facebook Access Token detected."

  - name: "Anthropic API Key"
    pattern: "sk-ant-[a-zA-Z0-9\\-_]{30,}"
    description: "Anthropic API Key detected."



  - name: "Twilio API Key"
    pattern: "SK[0-9a-fA-F]{32}"
    description: "Twilio API Key detected."

  - name: "Twilio Account SID"
    pattern: "AC[a-zA-Z0-9_\\-]{32}"
    description: "Twilio Account SID detected."

  - name: "Salesforce Access Token"
    pattern: "00D[a-zA-Z0-9]{12,15}![a-zA-Z0-9_.]{15,}"
    description: "Salesforce Access Token detected."

  - name: "HuggingFace Token"
    pattern: "(?:hf_)[a-zA-Z0-9]{34,}"
    description: "HuggingFace Read/Write Token detected."

  - name: "Replicate API Token"
    pattern: "r8_[a-zA-Z0-9]{32,}"
    description: "Replicate API Key detected."

  - name: "Unsafe Deserialization"
    pattern: "pickle\\.load\\("
    description: "Avoid using pickle.load on untrusted data. It can allow arbitrary code execution."
    files: [".py"]

  - name: "Unsafe Execution (eval)"
    pattern: "eval\\("
    description: "Avoid using eval(). It can execute arbitrary code."
    files: [".py"]

  - name: "Unsafe Execution (exec)"
    pattern: "exec\\("
    description: "Avoid using exec(). It can execute arbitrary code."
    files: [".py"]

  - name: "Insecure SSL (verify=False)"
    pattern: "verify\\s*=\\s*False"
    description: "SSL verification disabled. This allows Man-in-the-Middle attacks."
    files: [".py"]

  - name: "Weak Hashing (MD5)"
    pattern: "hashlib\\.md5\\("
    description: "MD5 is a weak hash function. Use SHA-256 or stronger."
    files: [".py"]

  - name: "Binding to All Interfaces"
    pattern: "host=['\"]0\\.0\\.0\\.0['\"]|bind=['\"]0\\.0\\.0\\.0['\"]"
    description: "Binding to 0.0.0.0 exposes the service to all network interfaces."
    files: [".py"]

  - name: "Google Cloud Service Account"
    pattern: "\"type\":\\s*\"service_account\""
    description: "Google Cloud Service Account JSON detected."
    category: "credential-file"
    severity: "high"
    remediation: "Remove the service account JSON and rotate the key if it was committed."

  - name: "Bearer Authorization Header"
    pattern: "(?i)authorization['\"]?\\s*[:=]\\s*['\"]?Bearer\\s+[A-Za-z0-9._~+\\-/]+=*"
    description: "Hardcoded Bearer authorization header detected."
    category: "secret"
    severity: "high"
    remediation: "Move the bearer token to an environment variable or secret manager."

  - name: "npm Token"
    pattern: "(?i)(?:_authToken|npm_[a-zA-Z0-9_]+)\\s*=\\s*['\"]?(?:npm_[A-Za-z0-9]{20,}|[A-Za-z0-9_\\-]{24,})['\"]?"
    description: "npm authentication token detected."
    category: "secret"
    severity: "high"
    remediation: "Revoke the npm token and reference it via an environment variable."

  - name: "PyPI Token"
    pattern: "pypi-[A-Za-z0-9_\\-]{20,}"
    description: "PyPI API token detected."
    category: "secret"
    severity: "high"
    remediation: "Revoke the PyPI token and load it from an environment variable."

  - name: "MCP Env Literal Secret"
    pattern: "\"(?:env|headers)\"\\s*:\\s*\\{[^\\n]*(?:API_KEY|TOKEN|SECRET|PASSWORD)[^\\n]*:\\s*\"(?!\\$\\{?[A-Z_][A-Z0-9_]*\\}?)[^\"]{12,}\""
    description: "MCP or agent config contains a literal secret-like env/header value."
    category: "agent-config"
    severity: "high"
    remediation: "Move the literal value into an environment variable and reference the variable from config."

  - name: "PostgreSQL / MySQL URI"
    pattern: "(?:postgres|mysql)://[a-zA-Z0-9_]+:[^@]+@[a-zA-Z0-9.-]+:[0-9]+/[a-zA-Z0-9_]+"
    description: "Database URI with credentials detected."

  - name: "MongoDB URI"
    pattern: "mongodb(?:\\+srv)?://[a-zA-Z0-9_]+:[^@]+@[a-zA-Z0-9.-]+"
    description: "MongoDB URI with credentials detected."

  - name: "Redis URI"
    pattern: "redis://(?:[a-zA-Z0-9_]+:)?[^@]+@[a-zA-Z0-9.-]+:[0-9]+"
    description: "Redis URI with credentials detected."

  - name: "JWT Token"
    pattern: "eyJ[A-Za-z0-9-_=]+\\.[A-Za-z0-9-_=]+\\.?[A-Za-z0-9-_.+/=]*"
    description: "Hardcoded JWT Token detected. May contain sensitive claims or be a valid session."

  - name: "Command Injection Risk (shell=True)"
    pattern: "shell\\s*=\\s*True"
    description: "Using shell=True in subprocess can lead to command injection if inputs are not sanitized."
    files: [".py"]

  - name: "Flask/Django Debug Mode"
    pattern: "DEBUG\\s*=\\s*True|app\\.run\\(.*debug\\s*=\\s*True.*\\)"
    description: "Running with Debug mode enabled in production can expose sensitive internal data."
    files: [".py"]

  - name: "Disabled Node TLS"
    pattern: "NODE_TLS_REJECT_UNAUTHORIZED\\s*=\\s*['\"]?0['\"]?"
    description: "Disabling TLS verification globally in Node.js allows Man-in-the-Middle attacks."
    files: [".js", ".ts"]

  - name: "React dangerouslySetInnerHTML"
    pattern: "dangerouslySetInnerHTML"
    description: "Using dangerouslySetInnerHTML can expose the application to XSS attacks."
    files: [".jsx", ".tsx", ".js", ".ts"]

  - name: "Docker Root User"
    pattern: "^\\s*USER\\s+root"
    description: "Running containers as root is discouraged. Create and use a non-root user."

  - name: "SQL Injection Risk (f-string/template)"
    pattern: "(?i)(?:SELECT|INSERT|UPDATE|DELETE).+(?:%s|\\{[^}]+\\}|\\$)"
    description: "Potential SQL injection risk. Ensure parameterized queries are used instead of string formatting."
